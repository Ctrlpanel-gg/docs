name: Validate static Fumadocs site
on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:
jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun scripts/audit-headings.ts
      - run: bun scripts/verify-export.ts
